name: Lint and Test

# tells GitHub to run the workflow on every push
on:
  push:
    branches: [ main ]

jobs:
  build:
    # boots up a fresh Linux machine in the cloud.
    runs-on: ubuntu-latest
    
    # 3. look into the correct folder.
    defaults:
      run:
        working-directory: ./frontend/mall_nav
        
    steps:
    - uses: actions/checkout@v4 # Downloads code onto the server
    - name: Use Node.js
      uses: actions/setup-node@v4 # Installs Node.js
      with:
        node-version: '20.x'
    - run: npm install # Installs dependencies
    - run: npm run lint # Runs the Next.js linter to check for code errors